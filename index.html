<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Cantabrana — Retazos de Vida</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --gold:#c8922a;
  --gold-light:#f0c060;
  --dark:#0a0805;
}

html,body{
  width:100%;height:100%;
  background:#000;
  overflow:hidden;
  font-family:'Cormorant Garamond',Georgia,serif;
  color:#fff;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;
  user-select:none;
}

/* CANVAS FONDO */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}

/* LOADING */
#loading{
  position:fixed;inset:0;z-index:100;
  background:#000;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:24px;
  transition:opacity 1.2s ease;
}
#loading.fade{opacity:0;pointer-events:none}
.ld-titulo{
  font-family:'Cinzel',serif;
  font-size:clamp(14px,4vw,20px);
  letter-spacing:8px;
  color:var(--gold);
  text-transform:uppercase;
}
.ld-linea{
  width:60px;height:1px;
  background:linear-gradient(to right,transparent,var(--gold),transparent);
  animation:ld-pulse 1.8s ease-in-out infinite;
}
@keyframes ld-pulse{0%,100%{width:30px;opacity:.3}50%{width:80px;opacity:1}}

/* PERGAMINO */
#pant-pergamino{
  position:fixed;inset:0;z-index:10;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity 1.5s ease;
  pointer-events:none;
}
#pant-pergamino.show{opacity:1;pointer-events:all}

.perg-outer{
  position:relative;
  width:min(88vw,400px);
  cursor:pointer;
  animation:float 5s ease-in-out infinite;
  filter:drop-shadow(0 0 30px rgba(200,146,42,.35));
  transition:filter .3s ease;
}
.perg-outer:active{filter:drop-shadow(0 0 60px rgba(200,146,42,.8));transform:scale(.98)}

@keyframes float{
  0%,100%{transform:translateY(0) rotateX(2deg)}
  50%{transform:translateY(-10px) rotateX(2deg)}
}

/* Aura */
.aura{
  position:absolute;inset:-30px;
  border-radius:16px;
  background:radial-gradient(ellipse at center,rgba(200,146,42,.18) 0%,transparent 65%);
  animation:aura 3.5s ease-in-out infinite;
  pointer-events:none;z-index:-1;
}
@keyframes aura{
  0%,100%{opacity:.4;transform:scale(1)}
  50%{opacity:1;transform:scale(1.06)}
}

/* Partículas de luz */
.particulas{
  position:absolute;inset:0;pointer-events:none;overflow:hidden;
}
.part{
  position:absolute;
  width:2px;height:2px;
  background:var(--gold-light);
  border-radius:50%;
  opacity:0;
  animation:part-float 4s ease-in-out infinite;
}
.part:nth-child(1){left:20%;top:80%;animation-delay:0s}
.part:nth-child(2){left:50%;top:90%;animation-delay:1s}
.part:nth-child(3){left:80%;top:75%;animation-delay:2s}
.part:nth-child(4){left:35%;top:85%;animation-delay:.5s}
.part:nth-child(5){left:65%;top:88%;animation-delay:1.5s}
@keyframes part-float{
  0%{opacity:0;transform:translateY(0) scale(1)}
  30%{opacity:.8}
  100%{opacity:0;transform:translateY(-60px) scale(.3)}
}

#perg-img{
  width:100%;display:block;border-radius:4px;
}

/* Texto sobre el pergamino */
.perg-texto{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-52%);
  width:68%;
  text-align:center;
}
.aviso{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:clamp(12px,3.5vw,17px);
  color:rgba(40,20,5,.88);
  line-height:1.65;
  text-shadow:0 1px 3px rgba(255,220,150,.4);
}
.toca{
  margin-top:14px;
  font-family:'Cinzel',serif;
  font-size:clamp(8px,2vw,10px);
  letter-spacing:3px;
  color:rgba(60,30,5,.5);
  text-transform:uppercase;
  animation:pulso 2.2s ease-in-out infinite;
}
@keyframes pulso{0%,100%{opacity:.35}50%{opacity:1}}

/* Sello lacrado */
.sello{
  position:absolute;
  bottom:-22px;right:10%;
  width:clamp(52px,13vw,72px);
  filter:drop-shadow(0 3px 12px rgba(140,20,20,.65));
  animation:sello-glow 3s ease-in-out infinite;
}
@keyframes sello-glow{
  0%,100%{filter:drop-shadow(0 3px 8px rgba(140,20,20,.4))}
  50%{filter:drop-shadow(0 3px 24px rgba(180,30,30,.9))}
}

/* REPRODUCTOR */
#pant-repro{
  position:fixed;inset:0;z-index:20;
  display:none;flex-direction:column;
}
#pant-repro.show{display:flex}

/* Foto fondo */
#foto-wrap{position:fixed;inset:0;z-index:0;background:#000}
#foto-blur{
  position:absolute;inset:-30px;
  background-size:cover;background-position:center;
  filter:blur(22px) brightness(.28) saturate(.7);
  transform:scale(1.1);
  transition:background-image 1.2s ease;
}
#foto-main{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
}
#foto-img{
  max-width:100%;max-height:100%;
  object-fit:contain;
  opacity:0;transition:opacity 1s ease;
}
#foto-img.show{opacity:1}

/* Transición */
#foto-trans{
  position:fixed;inset:0;z-index:25;
  background:#000;opacity:0;pointer-events:none;
  transition:opacity .7s ease;
}
#foto-trans.on{opacity:1}

/* UI top */
#ui-top{
  position:fixed;top:0;left:0;right:0;z-index:30;
  padding:24px 20px 50px;
  background:linear-gradient(to bottom,rgba(0,0,0,.75) 0%,transparent 100%);
  display:flex;justify-content:space-between;align-items:flex-start;
}
.cantante{
  font-family:'Cinzel',serif;
  font-size:clamp(10px,2.8vw,14px);
  letter-spacing:2px;
  color:rgba(255,255,255,.85);
  text-transform:uppercase;
}
.municipio{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:clamp(12px,3.2vw,16px);
  color:var(--gold);
  margin-top:3px;
}

/* Indicador música */
#ambient-ind{
  display:flex;align-items:center;gap:5px;
  opacity:0;transition:opacity .8s ease;
}
#ambient-ind.show{opacity:1}
.bars{display:flex;align-items:flex-end;gap:2px;height:14px}
.bar{
  width:2px;background:var(--gold);border-radius:1px;
  animation:bar 1.1s ease-in-out infinite;
}
.bar:nth-child(1){height:5px;animation-delay:0s}
.bar:nth-child(2){height:10px;animation-delay:.2s}
.bar:nth-child(3){height:14px;animation-delay:.35s}
.bar:nth-child(4){height:7px;animation-delay:.1s}
@keyframes bar{0%,100%{transform:scaleY(.35);opacity:.5}50%{transform:scaleY(1);opacity:1}}
.amb-lbl{
  font-family:'Cinzel',serif;font-size:8px;
  letter-spacing:2px;color:rgba(200,146,42,.7);text-transform:uppercase;
}

/* Progreso */
#prog-wrap{
  position:fixed;bottom:76px;left:20px;right:20px;z-index:30;
}
#prog-bar{height:2px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
#prog-fill{
  height:100%;width:0%;border-radius:2px;
  background:linear-gradient(to right,var(--gold),var(--gold-light));
  transition:width .5s linear;
}

/* Ticker */
#ticker{
  position:fixed;bottom:52px;left:0;right:0;z-index:30;
  overflow:hidden;height:18px;
}
#ticker-in{
  display:inline-block;white-space:nowrap;padding-left:100%;
  font-family:'Cinzel',serif;font-size:9px;letter-spacing:2px;
  color:rgba(200,146,42,.55);text-transform:uppercase;
  animation:ticker 22s linear infinite;
}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}

/* Botones finales */
#ui-bottom{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  padding:16px 20px;
  padding-bottom:max(16px,env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(0,0,0,.8) 0%,transparent 100%);
  display:flex;gap:12px;justify-content:center;
  opacity:0;transition:opacity 1s ease;pointer-events:none;
}
#ui-bottom.show{opacity:1;pointer-events:all}

.btn{
  font-family:'Cinzel',serif;
  font-size:10px;letter-spacing:3px;text-transform:uppercase;
  padding:11px 24px;
  border:1px solid rgba(200,146,42,.4);
  background:rgba(0,0,0,.55);color:var(--gold);
  cursor:pointer;border-radius:2px;
  transition:all .25s ease;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.btn:active{background:rgba(200,146,42,.25);border-color:var(--gold)}

/* PANTALLA FINAL */
#pant-final{
  display:none;position:fixed;inset:0;z-index:50;
  background:rgba(0,0,0,.93);
  align-items:center;justify-content:center;
  flex-direction:column;gap:20px;
  text-align:center;padding:40px;
}
#pant-final.show{display:flex}
.fin-titulo{
  font-family:'Cinzel',serif;
  font-size:clamp(18px,5vw,28px);
  letter-spacing:5px;color:var(--gold);text-transform:uppercase;
}
.fin-subtitulo{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:clamp(13px,3.5vw,17px);
  color:rgba(255,255,255,.5);
  max-width:300px;line-height:1.8;
}
.fin-btns{display:flex;gap:16px;margin-top:20px;flex-wrap:wrap;justify-content:center}

/* Sin pergamino fallback */
.perg-fallback{
  width:min(88vw,400px);
  background:radial-gradient(ellipse at center,#2a1a08,#0a0500);
  border:1px solid rgba(200,146,42,.3);
  border-radius:8px;
  padding:40px 30px;
  text-align:center;
  cursor:pointer;
}
.perg-fallback .aviso{color:rgba(245,230,200,.85)}
.perg-fallback .toca{color:rgba(200,146,42,.6)}
</style>
</head>

<canvas id="bg"></canvas>

<!-- LOADING -->

      <path d="M26 52 Q40 59 54 52" stroke="rgba(200,146,42,.6)" stroke-width=".8" fill="none"/>

        <div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div>
      </div>
      <span class="amb-lbl">Ambiente</span>

  </div>

  <div id="prog-wrap">
    <div id="prog-bar"><div id="prog-fill"></div></div>
  </div>

  <div id="ticker"><span id="ticker-in">♪ Cantabrana · Retazos de Vida · Patrimonio Musical ♪</span></div>

  <div id="ui-bottom">
    <button class="btn" onclick="reiniciar()">↺ Reiniciar</button>
    <button class="btn" onclick="salir()">Salir ✕</button>

<div id="pant-final">

  <div class="fin-btns">
    <button class="btn" onclick="reiniciar()">↺ Escuchar otra jota</button>

</div>

(function initGL(){
  const cv = document.getElementById('bg');
  const gl = cv.getContext('webgl');
  if (!gl) return;
  
  function resize(){
    cv.width = window.innerWidth;
    cv.height = window.innerHeight;
    gl.viewport(0,0,cv.width,cv.height);
  }
  window.addEventListener('resize', resize);
  resize();

  const vs = `attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}`;
  const fs = `
precision mediump float;
uniform float t;uniform vec2 r;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
float n(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),u.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),u.x),u.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n(p);p*=2.1;a*=.5;}return v;}
void main(){
  vec2 uv=gl_FragCoord.xy/r;
  float f=fbm(uv*2.8+t*.12);
  float f2=fbm(uv*5.5-t*.08);
  vec3 c1=vec3(.05,.03,.01),c2=vec3(.14,.08,.02),c3=vec3(.06,.04,.01);
  vec3 col=mix(c1,mix(c2,c3,f2),f);
  col*=(.7+.3*fbm(uv*9.+t*.15));
  gl_FragColor=vec4(col,1.);
}`;

  function mkShader(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s,src); gl.compileShader(s); return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, mkShader(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog); gl.useProgram(prog);
  
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  const ap = gl.getAttribLocation(prog,'p');
  gl.enableVertexAttribArray(ap);
  gl.vertexAttribPointer(ap,2,gl.FLOAT,false,0,0);
  
  const ut = gl.getUniformLocation(prog,'t');
  const ur = gl.getUniformLocation(prog,'r');
  const t0 = performance.now();
  
  (function loop(){
    const t = (performance.now()-t0)/1000;
    gl.uniform1f(ut,t);
    gl.uniform2f(ur,cv.width,cv.height);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    requestAnimationFrame(loop);
  })();
})();

// ═══════════════════════════════════════════════════════════════
// INICIO
// ═══════════════════════════════════════════════════════════════
async function init(){
  // Detectar jota del QR
  const p = new URLSearchParams(location.search);
  const param = p.get('jota') || p.get('j');
  
  if (param) {
    // Buscar jota por nombre de archivo
    jota = CFG.jotas.find(j => 
      j.a.toLowerCase().includes(param.toLowerCase()) ||
      param.toLowerCase().includes(j.a.toLowerCase().replace('.mp3',''))
    );
  }
  
  // Si no encontró, jota aleatoria
  if (!jota) jota = CFG.jotas[Math.floor(Math.random() * CFG.jotas.length)];

  // Cargar pergamino
  try {
    const pUrl = ['fotos/pergaminos/pergamino01.png','fotos/pergaminos/pergamino02.png','fotos/pergaminos/pergamino03.png','fotos/pergaminos/pergamino04.png','fotos/pergaminos/pergamino05.png'][Math.floor(Math.random()*5)];
    document.getElementById('perg-img').src = pUrl;
  } catch(e) {
    document.getElementById('perg-img').style.display = 'none';
    mostrarFallback();
  }

  // Ocultar loading
  setTimeout(() => {
    document.getElementById('loading').classList.add('fade');
    setTimeout(() => {
      document.getElementById('pant-pergamino').classList.add('show');
    }, 600);
  }, 1800);
}

function mostrarFallback(){
  const outer = document.getElementById('perg-outer');
  outer.style.background = 'radial-gradient(ellipse at center, #2a1a08, #0a0500)';
  outer.style.borderRadius = '8px';
  outer.style.border = '1px solid rgba(200,146,42,.3)';
  outer.style.padding = '40px 30px';
  document.querySelector('.perg-texto .aviso').style.color = 'rgba(245,230,200,.85)';
  document.querySelector('.perg-texto .toca').style.color = 'rgba(200,146,42,.6)';
}

// ═══════════════════════════════════════════════════════════════
// INICIAR JOTA
// ═══════════════════════════════════════════════════════════════
async function iniciarJota(){
  if (!jota) return;

  // Ocultar pergamino
  document.getElementById('pant-pergamino').style.opacity = '0';
  document.getElementById('pant-pergamino').style.pointerEvents = 'none';

  // Cargar fotos
  await cargarFotos();

  // Mostrar reproductor
  document.getElementById('pant-repro').classList.add('show');
  document.getElementById('cantante').textContent = jota.c;
  document.getElementById('municipio').textContent = jota.m;
  document.getElementById('ticker-in').textContent = 
    `♪  ${jota.c} · ${jota.m} · Retazos de Vida · Cantabrana  ♪`;

  // Cargar audio
  const urlJota = CFG.jotas_url + encodeURIComponent(jota.a);
  aJota.src = urlJota;
  aJota.load();
  aJota.volume = 1;

  // Mostrar indicador ambiente
  document.getElementById('ambient-ind').classList.add('show');

  // Iniciar fotos y audio
  setTimeout(() => {
    mostrarFoto(0);
    aJota.play().catch(e => console.warn('Audio play error:', e));
    iniciarProgreso();
  }, 600);

  aJota.onended = finJota;
}

function mostrarFoto(idx){
  if (!fotos.length) return;
  const url = fotos[idx % fotos.length];
  const trans = document.getElementById('foto-trans');
  const img   = document.getElementById('foto-img');
  const blur  = document.getElementById('foto-blur');

  trans.classList.add('on');
  img.classList.remove('show');

  setTimeout(() => {
    img.src = url;
    blur.style.backgroundImage = `url('${url}')`;
    img.onload = () => {
      setTimeout(() => {
        trans.classList.remove('on');
        img.classList.add('show');
      }, 150);
    };
    img.onerror = () => {
      trans.classList.remove('on');
    };
  }, 350);

  fotoIdx = idx;
  clearTimeout(fotoTimer);
  fotoTimer = setTimeout(() => mostrarFoto(idx + 1), (CFG.dur_foto + CFG.dur_trans) * 1000);
}

// ═══════════════════════════════════════════════════════════════
// PROGRESO
// ═══════════════════════════════════════════════════════════════
function iniciarProgreso(){
  clearInterval(progresoInter);
  progresoInter = setInterval(() => {
    if (!aJota.duration) return;
    const pct = (aJota.currentTime / aJota.duration) * 100;
    document.getElementById('prog-fill').style.width = pct + '%';
    if (pct >= 99.5) clearInterval(progresoInter);
  }, 500);
}

// ═══════════════════════════════════════════════════════════════
// FIN
// ═══════════════════════════════════════════════════════════════
function finJota(){
  clearTimeout(fotoTimer);
  clearInterval(progresoInter);
  document.getElementById('prog-fill').style.width = '100%';
  
  // Mostrar botones
  document.getElementById('ui-bottom').classList.add('show');
  
  // Pantalla final después de 8s
  setTimeout(() => {
    document.getElementById('pant-repro').style.display = 'none';
    document.getElementById('pant-final').classList.add('show');
  }, 8000);
}

// ═══════════════════════════════════════════════════════════════
// CONTROLES
// ═══════════════════════════════════════════════════════════════
function reiniciar(){
  aJota.pause(); aJota.src = '';
  clearTimeout(fotoTimer); clearInterval(progresoInter);
  location.reload();
}

function salir(){
  aJota.pause(); aAmb.pause();
  document.body.style.transition = 'opacity .8s ease';
  document.body.style.opacity = '0';
  setTimeout(() => {
    try { window.close(); } catch(e){}
    document.body.innerHTML = '<style>body{background:#000;margin:0}</style>';
  }, 900);
}

// ARRANQUE
document.addEventListener('DOMContentLoaded', init);
</script>
