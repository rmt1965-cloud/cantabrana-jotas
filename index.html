<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cantabrana Patrimonio 8K</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #main-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: block; }
        #loader { position: fixed; inset: 0; background: black; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; transition: opacity 1s; }
        #restart { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 15px 30px; border: 1px solid #c5a059; color: #c5a059; background: none; cursor: pointer; display: none; z-index: 1000; }
    </style>
</head>
<body>
    <canvas id="main-canvas"></canvas>
    <div id="loader"><h1 style="color:#c5a059">CANTABRANA 8K</h1></div>
    <button id="restart" onclick="location.reload()">REPETIR LITURGIA</button>
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());
    </script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
